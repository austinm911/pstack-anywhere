# Per-harness targets and mechanisms.
#
# Every harness discovers skills as <skillsRoot>/<skill-name>/SKILL.md, one level
# deep, non-recursive, with `name` and `description` frontmatter. That shared
# layout is why skills/ needs no per-harness transform.
#
# Two separate concerns live here. Distribution is a skills directory, and it is
# nearly the same everywhere. Configuration is role values, which have to sit in
# loaded context rather than a skills directory, so they land in a context file
# or a rule file and carry their own hazards.

# Where the pack goes.
#
# ~/.agents/skills is read natively by Codex, pi, and OMP, so one location covers
# three of four harnesses. Claude Code is the only holdout and needs its own
# root. Two locations, not four, and the second can be a symlink.
distribution:
  canonical: ~/.agents/skills
  alsoRead: ~/.agent/skills

  # Whether the harness reads the shared root, with a source you can check on
  # your own platform.
  readsAgentsSkills:
    codex: >-
      Yes. Its skills loader joins `.agents` and `skills` into a skills root, and
      handles a symlinked skill directory. Readable in the strings of the codex
      native binary, next to the loader's error messages.
    pi: >-
      Yes. `userAgentsSkillsDir = join(getHomeDir(), ".agents", "skills")`, plus
      an ancestor walk of project `.agents/skills` up to the git root. Readable
      in pi's shipped dist bundle.
    omp: >-
      Yes. The `agents` provider at priority 70, with its own enableAgentsUser
      and enableAgentsProject toggles independent of the claude, codex, and pi
      toggles. Documented in omp://skills.md.
    claude: >-
      No. Its skills root is `.claude` + `skills`, and its binary contains no
      reference to an agents directory.

  symlinksAreSafe: >-
    Codex names a symlinked skill directory explicitly in its loader, and OMP
    deduplicates identical files by realpath. So one canonical copy in
    ~/.agents/skills plus a symlink at ~/.claude/skills/<name> serves every
    harness without a duplicate-name collision. Copies into several roots would
    collide by name instead.

# Where role values go. Not a skills directory, because the values have to be in
# loaded context for a skill to read them.
configuration:
  shadowing: >-
    On OMP only one user-scope context file survives across all providers, and
    native ~/.omp/agent/AGENTS.md has the highest priority, so
    ~/.agents/AGENTS.md loses at user scope. Put user-scope config in
    ~/.omp/agent/RULES.md, which is an always-apply rule and never enters that
    dedup.
  notShareable: >-
    Hooks, tool names, and subagent definitions. Four incompatible hook formats,
    so anything depending on a hook needs four writers.

harnesses:
  - id: claude
    name: Claude Code
    configDir: ~/.claude
    skillsRoot: ~/.claude/skills
    contextFile: ~/.claude/CLAUDE.md
    settings: ~/.claude/settings.json
    subagentsDir: ~/.claude/agents
    commandsDir: ~/.claude/commands
    projectDir: .claude
    hooks:
      config: ~/.claude/settings.json#hooks
      form: 'event map of { matcher, hooks: [{ type: "command", command }] }'
      scriptDir: ~/.claude/hooks
      eventsSeen: [PreToolUse, PreCompact, SessionStart, SubagentStart]
    notes:
      - Project context is <cwd>/.claude/CLAUDE.md with no ancestor walk-up.

  - id: codex
    name: Codex
    configDir: ~/.codex
    skillsRoot: ~/.codex/skills
    contextFile: ~/.codex/AGENTS.md
    settings: ~/.codex/config.toml
    subagentsDir: ~/.codex/agents
    commandsDir: ~/.codex/prompts
    projectDir: null
    hooks:
      config: ~/.codex/hooks.json
      form: 'the same event map as Claude, under a top-level hooks key'
      scriptDir: ~/.codex/hooks
    notes:
      - >-
        User-scope context only. Project context comes from a standalone
        AGENTS.md, not <cwd>/.codex/AGENTS.md.
      - Also carries config.json alongside config.toml.

  - id: pi
    name: pi
    configDir: ~/.pi/agent
    skillsRoot: ~/.pi/agent/skills
    contextFile: ~/.pi/agent/AGENTS.md
    settings: ~/.pi/agent/settings.json
    subagentsDir: ~/.pi/agent/agents
    commandsDir: ~/.pi/agent/prompts
    projectDir: .pi
    hooks:
      config: ~/.pi/agent/settings.json#hooks
      form: 'array of TS or JS module paths, such as ~/.pi/agent/hooks/rewind/index.ts'
      scriptDir: ~/.pi/agent/hooks
    notes:
      - Agent state lives one level down at ~/.pi/agent, not ~/.pi.

  - id: omp
    name: Oh My Pi
    configDir: ~/.omp/agent
    skillsRoot: ~/.agents/skills
    contextFile: ~/.omp/agent/AGENTS.md
    settings: ~/.omp/agent/config.yml
    subagentsDir: ~/.omp/agent/agents
    commandsDir: null
    projectDir: .omp
    hooks:
      config: ~/.omp/agent/config.yml#extensions
      form: 'default-exported TS factory taking HookAPI, registering pi.on(event, handler)'
      scriptDir: .omp/hooks/pre
    readsOtherRoots:
      - ~/.omp/agent/skills
      - ~/.claude/skills
      - ~/.codex/skills
      - ~/.pi/agent/skills
      - ~/.agent/skills
      - ~/.agents/skills
    providerPriority:
      native: 100
      omp-plugins: 90
      claude: 80
      agents: 70
      claude-plugins: 70
      codex: 70
      opencode: 55
      github: 30
      omp-managed: 5
    notes:
      - >-
        OMP is the union. It discovers every other harness's skills root, so it
        needs no root of its own once one of them is populated.
      - >-
        Dedup is by skill name, first match wins by provider priority, and
        identical files are collapsed by realpath. Symlinks from one canonical
        store are therefore safe. Copies into several roots are not.
      - >-
        Sticky rules come only from RULES.md at ~/.omp/agent or the nearest
        non-empty project .omp/ directory.
