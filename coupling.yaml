# Coupling ledger: every Cursor primitive, Cursor-team plugin, or Cursor-only
# path the port replaces, resolved per harness. Humans edit this file.
# PORTABILITY.md, the README status block, and capabilities.md are rendered
# from it: run `bun run render` after edits. Terms: README.md#vocabulary
#
# Schema v2. Each `axes` entry has id, kind, what, tokens, occurrences, and
# exactly one of: resolution (every harness id to { parity, use }), invariant
# (one { parity, use }; use = absent path for role/prerequisite, replacement
# addressing for path_assumption, new name for naming), parameters (list of
# { id, resolution }; axis parity is the worst). kind: capability,
# parameter_set, role, prerequisite, path_assumption, naming, frontmatter.
# parity: native, substitute, extension (add fallback), degrade (use names the
# weaker path), drop (playbook must say so). scripts/coupling.mjs rejects keys
# status, ported, verified, implementation, verification anywhere here. Paths
# are full repo-relative under one root; no skills/poteto-mode fallback.

version: 2

upstream:
  repo: https://github.com/cursor/plugins
  path: pstack
  sha: b9ddc83c32972210b8a94d389130713e8eed346e

# `registry` is whether the harness has a harnesses.yaml entry, and
# `evidence_dir` whether pinned upstream source is saved for it. Cursor has
# neither: it is upstream's own target, so its column reports upstream behavior
# rather than a parity claim this repo checked against saved source. No cursor
# cell can reach `static`, which is the method that reads that source. A cursor
# cell can still reach `exercised`, on the same conformance run contract as
# every other harness.
harnesses:
  - id: cursor
    label: Cursor
    baseline: true
    registry: false
    evidence_dir: null
  - id: claude
    label: Claude Code
    registry: true
    evidence_dir: references/harnesses/claude
    source_availability: >-
      Docs and example plugins only. The CLI ships bundled, so the saved source
      proves authoring contracts, not loader behavior. Most runtime claims about
      Claude are observations from one machine, which is the observed_local
      evidence class and never renders as verified.
  - id: codex
    label: Codex
    registry: true
    evidence_dir: references/harnesses/codex
  - id: pi
    label: pi
    registry: true
    evidence_dir: references/harnesses/pi
  - id: omp
    label: Oh My Pi
    registry: true
    evidence_dir: references/harnesses/omp

axes:
  - id: spawn_worker
    kind: capability
    what: Spawn a delegate that owns a unit of work end to end.
    resolution:
      cursor: { parity: native, use: 'Task with environment: "cloud"' }
      claude: { parity: substitute, use: "Agent tool (named Task in older docs), subagent_type" }
      codex: { parity: substitute, use: "spawn_agent with the exact brief; send_message for live steering and followup_task for another turn when offered" }
      pi: { parity: extension, use: 'subagent({agent:"<name>"}) via pi-subagents; fresh child context from .pi/agent/extensions/subagent/config.json', fallback: "without pi-subagents, no delegation primitive" }
      omp: { parity: substitute, use: "task tool, agent field selects the specialist" }
    tokens:
      - pattern: 'environment:\s*"cloud"'
        why: a cloud worker couples spawn_worker and worker_durability
        also: [worker_durability]
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/autopilot-stack.md
      - path: skills/poteto-mode/playbooks/shipping.md
      - path: skills/poteto-mode/playbooks/orchestrate.md

  - id: worker_durability
    kind: capability
    what: >-
      A spawned worker that outlives the session. Upstream leans on this hard:
      orchestrate.md tells a resumed coordinator that local agents are dead but
      cloud work is not, and to reattach by PR and branch rather than agent id.
    resolution:
      cursor: { parity: native, use: "cloud agents run off-machine and survive a restart" }
      claude: { parity: drop, use: "uninterrupted execution is not guaranteed after process exit; saved sessions and eligible subagents can resume with their history" }
      codex: { parity: drop, use: "uninterrupted execution is not guaranteed after process exit; saved sessions can resume by ID, while child resumption must be checked against the current tools" }
      pi: { parity: degrade, use: 'saved sessions can resume by path or ID; child/job recovery depends on the installed subagent extension; inspect its native resume support before falling back to saved reports' }
      omp: { parity: drop, use: "uninterrupted execution is not guaranteed after process exit; saved sessions can resume by ID or path, while child/job recovery depends on the current runtime" }
    consequence: >-
      Continuing to execute while the parent is offline, resuming a persisted
      conversation, and collecting child jobs are separate capabilities. Inspect
      liveness first, use native resume where supported, and reconcile actual
      work before any replacement spawn. Persist session/agent IDs, briefs and
      reports as recovery references; a stopped process does not erase history.
    occurrences:
      - path: skills/poteto-mode/playbooks/orchestrate.md
      - path: skills/setup-pstack-anywhere/references/recovery.md
      - path: skills/poteto-mode/playbooks/pause-safely.md
      - path: skills/poteto-mode/playbooks/session-pickup.md
      - path: skills/swarm/SKILL.md

  - id: probe_worker
    kind: capability
    what: >-
      Read a worker's liveness without resuming it. Upstream is explicit that a
      resume restarts an idle agent, so probing and resuming are different acts.
    resolution:
      cursor: { parity: native, use: "dashboard shows agent state without a resume" }
      claude: { parity: degrade, use: "job status only, no liveness for every delegate kind" }
      codex: { parity: substitute, use: "list_agents for observed status; collect completion messages and use wait_agent when offered" }
      pi: { parity: extension, use: "the job status the task extension exposes", fallback: "none, wait for the result" }
      omp: { parity: substitute, use: 'hub op:"jobs" while live, hub op:"list" once settled' }
    occurrences:
      - path: skills/poteto-mode/playbooks/orchestrate.md
      - path: skills/poteto-mode/playbooks/shipping.md

  - id: wake_on_event
    kind: capability
    what: Sleep until an external event fires, rather than polling on a timer.
    resolution:
      cursor: { parity: native, use: "/loop built-in" }
      claude: { parity: substitute, use: "one background Bash wait, wake on its completion; heartbeat only when no such wait fits" }
      codex: { parity: degrade, use: "wait_agent for live worker events when offered; otherwise a bounded status check or a user-authorized heartbeat" }
      pi: { parity: degrade, use: "30-second blocking bash poll; heartbeat only when no such wait fits" }
      omp: { parity: substitute, use: 'hub op:"wait"' }
    consequence: >-
      Upstream already documents the heartbeat as its own no-event path, so the
      degraded path is prose that already exists. Only the "pick the mechanism"
      step changes.
    tokens:
      - pattern: '(^|[\s(`])\/loop\b'
        why: /loop is Cursor's wake_on_event primitive
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/autonomous-run.md
      - path: skills/poteto-mode/playbooks/visual-parity.md
      - path: skills/poteto-mode/playbooks/shipping.md
      - path: skills/poteto-mode/playbooks/babysit.md
      - path: skills/poteto-mode/playbooks/bug-fix.md
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/autopilot-stack.md

  - id: worker_defaults
    kind: parameter_set
    what: >-
      The parameters upstream sets on every Task call. Highest-traffic coupling
      in the pack, since every playbook that delegates inherits them.
    parameters:
      - id: background
        resolution:
          cursor: { parity: native, use: "run_in_background: true" }
          claude: { parity: substitute, use: "run in background" }
          codex: { parity: substitute, use: "async" }
          pi: { parity: degrade, use: 'subagent({async:true}) returns at once; collect the result from a file the worker wrote' }
          omp: { parity: substitute, use: 'async, or hub op:"wait" to block' }
      - id: readonly
        resolution:
          cursor: { parity: native, use: "agent mode strips MCP" }
          claude: { parity: degrade, use: "Explore agent type drops Write and Edit but keeps Bash; the constraint held by the agent's instructions, not the tool surface" }
          codex: { parity: drop, use: "no read-only agent type in stock Codex; a plain spawn_agent worker can write" }
          pi: { parity: drop, use: 'subagent({agent:"scout"}), tools: read, grep, find, ls, bash, write' }
          omp: { parity: substitute, use: "scout agent is read-only" }
      - id: identity
        resolution:
          cursor: { parity: native, use: 'subagent_type: "poteto-agent"' }
          claude: { parity: substitute, use: "a poteto-agent definition in the harness subagent dir" }
          codex: { parity: substitute, use: "an available worker agent with the pstack brief and standing orders; use poteto-agent only if that definition is actually offered" }
          pi: { parity: extension, use: 'subagent({agent:"<name>"}) via pi-subagents reading ~/.pi/agent/agents (harnesses.yaml:330)', fallback: "without pi-subagents or a definition file, no named identity; use the parent model" }
          omp: { parity: substitute, use: "a poteto-agent definition in the harness subagent dir" }
      - id: model
        resolution:
          cursor: { parity: native, use: "explicit slug per role" }
          claude: { parity: substitute, use: "role slots" }
          codex: { parity: substitute, use: "role slots" }
          pi: { parity: extension, use: "role slots supplied through the pi-subagents extension", fallback: "no model selection, use the parent model" }
          omp: { parity: substitute, use: "role slots, or the agent field" }
    consequence: >-
      Use only worker identities the current tool exposes. Where a named
      poteto-agent is required, its definition must exist in the directory
      recorded by harnesses.yaml. Where the resolution supports an ordinary
      worker, supply the exact pstack brief and standing orders. Never name an
      absent agent type.
    tokens:
      - pattern: '\brun_in_background\b'
        why: run_in_background is the worker_defaults background parameter
        parameter: background
      - pattern: '\bsubagent_type\b'
        why: subagent_type is the worker_defaults identity parameter
        parameter: identity
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/orchestrate.md
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/arena/SKILL.md
      - path: skills/how/SKILL.md
      - path: skills/interrogate/SKILL.md
      - path: skills/no-comments/SKILL.md
      - path: skills/reflect/SKILL.md
      - path: skills/swarm/SKILL.md
      - path: skills/why/SKILL.md

  - id: human_question
    kind: capability
    what: Put a structured question with options to the human.
    resolution:
      cursor: { parity: native, use: "AskQuestion" }
      claude: { parity: substitute, use: "the ask tool" }
      codex: { parity: degrade, use: "request_user_input_async when offered for clarification; request_user_input only in an allowed mode; otherwise a plain question, with pending gates persisted" }
      pi: { parity: degrade, use: "a plain question in the reply; no recorded extension registers an ask tool" }
      omp: { parity: substitute, use: "the ask tool" }
    consequence: >-
      orchestrate.md parks human gates in gates.md so a completion flood cannot
      wipe pending question state. That file-backed gate is the portable part and
      matters more where the primitive is off by default or absent.
    tokens:
      - pattern: '\bAskQuestion\b'
        why: AskQuestion is Cursor's human_question primitive
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/autonomous-run.md
      - path: skills/poteto-mode/playbooks/orchestrate.md
      - path: skills/automate-me/SKILL.md

  - id: review_automation
    kind: role
    was: Bugbot
    what: >-
      An agentic reviewer that files PR comments. A GitHub-side service, not a
      harness feature, so it is the user's choice on every harness including
      Cursor. references/bugbot-triage.md generalizes to review-automation
      triage: its content is how to assess untrusted review text, which no
      harness changes.
    invariant:
      parity: substitute
      use: >-
        Apply the same skeptical triage to human review comments. The posture is
        the portable part.
    tokens:
      - pattern: '\bBugbot\b'
        flags: i
        why: review_automation is a role, not a vendor
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/references/bugbot-triage.md
      - path: skills/poteto-mode/playbooks/babysit.md
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/autopilot-stack.md
      - path: skills/reflect/references/synthesizer.md

  - id: slop_strip
    kind: role
    was: the deslop skill from the cursor-team-kit plugin
    what: A pre-commit pass that strips generated slop from a diff.
    invariant:
      parity: substitute
      use: Apply the unslop skill to the diff directly.
    tokens:
      - pattern: cursor-team-kit
        flags: i
        why: slop_strip, ui_driver, and cli_driver are roles
        also: [ui_driver, cli_driver]
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/opening-a-pr.md
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/autopilot-stack.md

  - id: ui_driver
    kind: role
    was: control-ui from cursor-team-kit
    what: Drives a browser, Electron, or web UI for runtime verification.
    invariant:
      parity: substitute
      use: >-
        Runtime UI verification is not available. Say so in the verification block
        rather than claiming a pass; a verdict of type-check-only is honest.
    tokens:
      - pattern: '\bcontrol-ui\b'
        why: control-ui is the ui_driver role
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/shipping.md
      - path: skills/poteto-mode/playbooks/opening-a-pr.md
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/orchestrate.md
      - path: skills/poteto-mode/playbooks/visual-parity.md

  - id: cli_driver
    kind: role
    was: control-cli from cursor-team-kit
    what: Drives a CLI or TUI for runtime verification.
    invariant:
      parity: substitute
      use: Same as ui_driver. Name the missing verification, do not imply one.
    tokens:
      - pattern: '\bcontrol-cli\b'
        why: control-cli is the cli_driver role
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/shipping.md
      - path: skills/poteto-mode/playbooks/opening-a-pr.md
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/orchestrate.md

  - id: skill_authoring
    kind: role
    was: Cursor's built-in create-skill
    what: The house rules for writing a SKILL.md.
    invariant:
      parity: substitute
      use: playbooks/authoring-a-skill.md carries the rules on its own.
    tokens:
      - pattern: '\bcreate-skill\b'
        why: create-skill is the skill_authoring role
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/authoring-a-skill.md
      - path: skills/automate-me/SKILL.md
      - path: skills/reflect/SKILL.md
      - path: skills/reflect/references/synthesizer.md

  - id: model_roles
    kind: role
    was: 'grok-4.6-fast-xhigh, claude-fable-5-thinking-max, gpt-5.6-sol-max'
    what: >-
      Upstream already assigns these slugs to roles. Port the roles into the
      prose and leave the slugs to the override file, so a model release does
      not churn every playbook.
    slots:
      - fast code
      - strong judgment
      - strong instruction following
      - prose and judgment
    invariant:
      parity: substitute
      use: The parent chat model, which is what inherit-parent and auto already mean.
    tokens:
      - pattern: '\b(grok|gpt|claude)-[a-z0-9.-]*(max|xhigh|thinking)[a-z0-9.-]*\b'
        flags: i
        why: model slugs are role slots
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/setup-pstack-anywhere/SKILL.md
        unscannable: >-
          Allowlisted whole-file in lint.allowlist, because it names the Cursor
          rule-file location on purpose. The lint therefore never reads it, so
          this occurrence is not checked rather than resolved.
      - path: skills/poteto-mode/scripts/check-plan.mjs
        unscannable: >-
          Not Markdown, so lint.scan never reaches it, and its directory is
          allowlisted for the shell -gt comparisons in its siblings. It is not
          checked rather than resolved.
      - path: skills/architect/SKILL.md
      - path: skills/arena/SKILL.md
      - path: skills/how/SKILL.md
      - path: skills/interrogate/SKILL.md
      - path: skills/reflect/SKILL.md
      - path: skills/swarm/SKILL.md
      - path: skills/why/SKILL.md

  - id: graphite
    kind: prerequisite
    binary: gt
    what: Stacked PR tooling. Upstream's stack playbooks assume it throughout.
    invariant:
      parity: drop
      use: >-
        Stack playbooks do not apply. Shipping, autopilot-stack, and the stack
        safety section have no plain-git equivalent worth faking.
    occurrences:
      - path: skills/poteto-mode/SKILL.md
      - path: skills/poteto-mode/playbooks/shipping.md
      - path: skills/poteto-mode/playbooks/babysit.md
      - path: skills/poteto-mode/playbooks/opening-a-pr.md
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/autopilot-stack.md
      - path: skills/poteto-mode/playbooks/orchestrate.md

  - id: github_cli
    kind: prerequisite
    binary: gh
    what: scripts/watch-pr reads PR state through it.
    invariant:
      parity: drop
      use: The Babysit playbook's watcher cannot run.
    no_occurrences: >-
      Named only inside skills/poteto-mode/scripts/, which lint.scan does not
      reach. Nothing in the Markdown prose depends on the binary by name, so
      there is no occurrence for a refresh diff to catch.

  - id: bun
    kind: prerequisite
    binary: bun
    what: Runtime for scripts/watch-pr and scripts/orch.
    invariant:
      parity: drop
      use: Those levers cannot run.
    no_occurrences: >-
      The dependency is a shebang inside skills/poteto-mode/scripts/, which
      lint.scan does not reach. Nothing in the Markdown prose runs the binary by
      name, so there is no occurrence for a refresh diff to catch.

  - id: pack_path
    kind: path_assumption
    was: 'pstack/skills/...'
    what: >-
      Upstream reads its own playbooks and scripts through a repo-relative path,
      which only exists when the pack is vendored into the working repo. Fails
      silently for anyone who installed the pack into a harness skills dir.
    # skill_identify showed the port's first replacement, skill://<name>/..., resolves
    # on no harness as written: omp keys the scheme by the frontmatter name, the
    # other three have no scheme, and claude and pi never list a
    # disable-model-invocation skill to the model. Every harness loads a skill
    # from a directory under one root, so the pack now addresses siblings as
    # ../<name>/<file> relative to the reading skill. Cells record how each
    # harness reached the file.
    resolution:
      cursor: { parity: native, use: "pstack/skills/... in the vendored pack" }
      claude: { parity: substitute, use: "../<name>/<file> under ~/.claude/skills; the skill is hidden from the model's listing, so the path is the only pointer" }
      codex: { parity: substitute, use: "../<name>/<file> under ~/.agents/skills; listed to the model as Poteto Mode" }
      pi: { parity: substitute, use: "../<name>/<file> under ~/.agents/skills; the skill is hidden from the model's listing, so the path is the only pointer" }
      omp: { parity: substitute, use: "../<name>/<file> under ~/.agents/skills; skill://Poteto Mode/<file> also works, keyed by frontmatter name" }
    tokens:
      - pattern: '\bpstack\/skills\b'
        why: a repo-relative pack path only a Cursor plugin install provides
    occurrences:
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md
      - path: skills/poteto-mode/playbooks/autopilot-full.md
      - path: skills/poteto-mode/playbooks/autopilot-stack.md

  - id: trunk_reread
    kind: path_assumption
    was: 'git show origin/main:pstack/skills/...'
    what: >-
      A multi-day program re-grounds on trunk's copy of a playbook rather than
      its own possibly-stale context. Depends on pack_path being inside the repo.
    invariant:
      parity: substitute
      use: >-
        Drop the git indirection. Re-read the playbook through the harness's own
        skill addressing, which is already current. The staleness the trunk read
        guarded against was context staleness, not disk staleness, and a plain
        re-read fixes that.
    tokens:
      - pattern: 'git show origin\/main:'
        why: a trunk re-read of the pack depends on pack_path
    occurrences:
      - path: skills/poteto-mode/playbooks/multi-phase-plan.md

  - id: transcript_dir
    kind: path_assumption
    was: 'agent-transcripts/'
    what: Local transcripts a worker may need to read.
    invariant:
      parity: substitute
      use: >-
        Per-harness session directory. Left as a role-style slot because the path
        is user and harness specific, and no playbook depends on its shape.
    tokens:
      - pattern: '\bagent-transcripts\b'
        why: agent-transcripts is the transcript_dir path assumption
    occurrences:
      - path: skills/poteto-mode/playbooks/session-pickup.md
      - path: skills/poteto-mode/playbooks/eval.md
      - path: skills/poteto-mode/playbooks/orchestrate.md
      - path: skills/automate-me/SKILL.md
      - path: skills/recall/SKILL.md
      - path: skills/reflect/SKILL.md
      - path: skills/show-me-your-work/SKILL.md

  - id: setup_entrypoint
    kind: naming
    was: /setup-pstack
    what: >-
      Upstream's installer command. This port renames it, so the old name in a
      ported file is a regression rather than a coupling left to resolve. v1
      enforced the token with no axis owning it; this is that owner.
    invariant:
      parity: substitute
      use: The skill is /setup-pstack-anywhere.
    tokens:
      - pattern: '\/setup-pstack\b(?!-anywhere)'
        why: /setup-pstack is upstream's name, and this port renamed it
    no_occurrences: >-
      The rename is complete in the ported skills, so there is no site to track.
      The token stays to catch a reintroduction.

  - id: frontmatter_portable
    kind: frontmatter
    portable: true
    what: >-
      All three are Agent Skills standard fields. Every target honors
      disable-model-invocation, so the mode gating that keeps a skill out of
      automatic model invocation ports with no change: Claude and pi accept both
      the kebab-case and camelCase spellings, Codex carries it alongside its own
      allow_implicit_invocation, and OMP normalizes the kebab-case form to its
      internal `hide`.
    keys: [name, description, disable-model-invocation]
    assert:
      # Counted from the tree rather than asserted in prose. v1 hardcoded
      # "39 of the 45 skills" with nothing to keep it true.
      kind: frontmatter_key_count
      key: disable-model-invocation
      spellings: [disable-model-invocation, disableModelInvocation]
      expect: 39
      of: 45
    no_occurrences: >-
      A frontmatter surface spans every skill, so an occurrence list would be
      the skill index. The counted assert is the anchor instead, and the report
      prints its result.

  - id: frontmatter_cursor_only
    kind: frontmatter
    portable: true
    what: >-
      Cursor presentation only, and inert rather than broken elsewhere. OMP
      preserves unrecognized keys as unknown metadata and the other three ignore
      them. Left in place: removing them would widen the refresh diff against
      upstream for no behavior change, and they are correct when the target is
      Cursor.
    keys: [mode, icon, color, reminder]
    no_occurrences: >-
      A frontmatter surface spans every skill, and these keys are inert
      everywhere but Cursor, so there is nothing to port and nothing to track
      per file.

# Cross-cutting lint: the one pattern that belongs to no axis. A bare mention
# of Cursor is fine in a harness column or a real disk path.
lint:
  scan: skills/**/*.md
  cursor_mentions:
    pattern: '\bCursor\b|\.cursor\/'
    context_exempt: '\bharness\b|column|upstream'
    context_exempt_flags: i
    why: name the capability, or allowlist the path in coupling.yaml
  ignore_substrings:
    - value: references/bugbot-triage.md
      why: A reference to the triage file by name is not a Bugbot mention.
  allowlist:
    - path: skills/poteto-mode/playbooks/worktree-cleanup.md
      why: '.cursor/worktrees/myrepo/x is a real disk path in an example about not hand-typing worktree paths.'
    - path: skills/poteto-mode/scripts/
      why: 'watch-pr detects review-automation authors by name; worktree-audit.sh uses shell -gt comparisons.'
    - path: skills/poteto-mode/capabilities.md
      why: 'Generated from coupling.yaml. Its cursor column names Cursor on purpose.'
    - path: skills/setup-pstack-anywhere/SKILL.md
      why: 'Names the Cursor rule-file location, since Cursor is a supported target.'

# Files rendered from this ledger. `rendered`: on disk, `coupling.mjs check`
# fails on drift. `planned`: renderer exists, file not written yet, reports as
# pending. `marker` names the region between `<!-- BEGIN GENERATED <marker> -->`
# and its END twin; only that region is replaced. A missing region is a ledger
# error, not a silent no-op.
generated:
  - path: skills/poteto-mode/capabilities.md
    renderer: capabilities
    state: rendered
  - path: PORTABILITY.md
    renderer: report
    state: rendered
  - path: README.md
    renderer: summary
    state: rendered
    marker: coupling-summary

# Volatile inputs, read when present. A missing file is not an error: every
# cell then derives unverified.
evidence:
  scenarios: conformance/scenarios.yaml
  attestations: evidence/attestations.yaml
  runs: evidence/runs
