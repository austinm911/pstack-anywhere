observations:
  - id: wake.mechanism
    observed: 'Two layers, no first-class file-event primitive. The agent found no harness event wait for a file (it read omp:// docs and checked for fswatch, inotifywait, watchman) and used a blocking shell command: bash tool, command "out=$(watchman-wait . -p ''event.flag'' -m 1 -t 1200 2>&1); rc=$?; date -u +%FT%TZ > woke-at.txt; ..." (wait-call.txt line 1: "watchman-wait . -p ''event.flag'' -m 1 -t 1200", line 2: "shell command", line 3: "file creation, file modification, file deletion/rename (watchman filesystem change notifications)"). OMP''s bash tool auto-backgrounded that command after 60 s ("Backgrounded as job bg_3; result will be delivered automatically.", details {"async":{"state":"running","jobId":"bg_3","type":"bash"},"timeoutSeconds":1300}), and the agent then blocked on the harness primitive `hub` with arguments {op: "wait", ids: ["bg_3"], timeoutMs: 1300000}, which sleeps until a watched job settles, a peer message arrives, or the timeout elapses. Trial 2 was identical with job bg_5. So the event kind the harness wait accepts is a background job settling (here a bash job wrapping the watchman file wait), not a file directly'
    source: invocation.json calls[4] (bash 22:49:51.431Z) and calls[5] (hub wait 22:50:54.014Z), calls[8..9] for trial 2; session/2026-09-02T22-49-22-600Z_01a06450-0ba8-70eb-9bb5-4dc183621d48.jsonl toolResult 22:50:51.436Z (.message.details.async) and toolCall at 22:50:54.014Z; wait-accounting.yaml wait_call; transcript.md
  - id: wake.turns_during_wait
    observed: 'From OMP''s session log, counting assistant entries and their usage objects. The wait was entered with the bash call at 22:49:51.431Z (cumulative totalTokens 33426) and returned with the hub wait tool result at 22:51:24.965Z. In between the parent made exactly one model turn: the hub wait call at 22:50:54.014Z, forced by the bash tool auto-backgrounding the blocking command after 60 s (output 133 tokens, totalTokens 33587). No turn occurred during the 31 s the hub wait itself was open (22:50:54.014Z to 22:51:24.965Z), and none during the 236 s trial 2 hub wait (22:52:41.738Z to 22:55:35.686Z, ended only by the operator''s Esc). Post-wake the parent made one turn, the DONE reply (output 115, totalTokens 33893). herdr exposes no turn counter; its state_change_seq moved 829 to 830 across the driver''s before/during snapshots. The driver''s "assistant_entries_during_wait: 5" counts from the prompt, including the four discovery and setup turns before the wait was entered'
    source: session jsonl assistant messages 22:49:51.431Z, 22:50:54.014Z, 22:51:28.087Z, 22:51:39.206Z, 22:52:41.738Z (.message.usage.output/.totalTokens); wait-accounting.yaml snapshots before_wait, during_wait, after_wake; drive.log accounting notes
