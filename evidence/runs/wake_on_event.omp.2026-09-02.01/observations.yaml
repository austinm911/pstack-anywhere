  - id: wake.event_kinds
    observed: 'Exercised: a background job settling (hub wait ids [bg_N]), where the job was a bash command blocked on a watchman filesystem notification for file creation; and, in trial 2, an operator interrupt (Esc) ending the wait. Documented by the hub tool but not exercised: an incoming peer message, a watched subagent task finishing, the timeout elapsing, a steering interrupt, and hub wait with name= for a supervised process reaching ready/exit or matching an output pattern. Not available as a harness event: a file change or an arbitrary external signal, which is why the agent wrapped watchman in a job'
