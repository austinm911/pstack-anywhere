# Hand-written by the operator from the artifacts in this directory.
observations:
  - id: wake.mechanism
    observed: 'No event-wait primitive; the agent wrote its own poll as a shell loop inside Codex''s exec tool. wait-call.txt records: "zsh -c ''deadline=$((SECONDS + 1200)); while [[ ! -e event.flag && $SECONDS -lt $deadline ]]; do sleep 30; done; if [[ -e event.flag ]]; then exit 0; else exit 124; fi''" / "shell command" / "none". It was run through the exec tool as tools.exec_command({cmd: <that loop>, workdir: <scratch>, yield_time_ms: 30000, max_output_tokens: 2000}) at 23:18:37.434Z; exec_command yields after yield_time_ms with a session_id (44476) while the loop keeps running, so the agent re-entered it with tools.write_stdin({session_id, chars: "", yield_time_ms: 60000, max_output_tokens: 2000}) and the harness''s wait tool ({cell_id, yield_time_ms: 60000, max_tokens: 2000}) until the loop exited. The event kind it accepts is whatever the shell can test, here a file; the bound (1200 s, exit 124) is the loop''s own, distinguishable from the file by exit code'
    source: wait-accounting.yaml wait_call; session/2026/09/02/rollout-2026-09-02T16-18-20-01a0646a-8f65-7a93-813c-dfda1271f701.jsonl custom_tool_call exec at 23:18:37.434Z, 23:19:10.952Z, 23:20:14.023Z and function_call wait at 23:19:43.762Z; invocation.json calls_workers (22 calls, names exec and wait only)
  - id: wake.turns_during_wait
    observed: 'Not zero. Between entering the wait (exec_command 23:18:37.434Z) and its return (write_stdin output with exit_code 0 at 23:20:39.319Z) the parent made 4 model round trips (exec_command returned at 23:19:07.668Z after its 30 s yield; write_stdin returned 23:19:41.979Z "Script running with cell ID 3"; wait returned 23:20:10.987Z; write_stdin returned 23:20:39.319Z) and emitted one assistant message at 23:19:09.766Z ("The bounded wait is active; it will only test for the file at 30-second intervals."). Token accounting from the rollout''s token_count events (cumulative total_token_usage): 14,756 total_tokens before the wait (23:18:32.139Z), 60,327 at the driver''s during_wait snapshot (23:20:21.615Z) and 75,816 when the wait returned (23:20:39.320Z), so about 61,000 total tokens across the wait, of which 48,128 cached input at the mid-wait snapshot; output_tokens grew from ~300 to 863 by mid-wait. The driver''s coarser count reads assistant_entries_during_wait: 2 (one of those is the pre-wait announcement) and herdr state_change_seq +1. Trial 2 shows the same shape: five write_stdin/wait pairs, each ~60 s, between 23:21:17Z and the abort'
    source: wait-accounting.yaml snapshots before_wait/during_wait/after_wake (usage, assistant_entries) and assistant_entries_during_wait; session/2026/09/02/rollout-2026-09-02T16-18-20-01a0646a-8f65-7a93-813c-dfda1271f701.jsonl event_msg token_count items at 23:18:32.139Z, 23:19:07.687Z, 23:19:41.999Z, 23:20:10.991Z, 23:20:39.320Z and the tool calls between them
  - id: wake.latency
    observed: '22 s. Trigger `touch event.flag` at 2026-09-02T23:20:21Z (scratch shell date -u); the loop''s next 30 s check found it and exited 0, the write_stdin call returned that exit at 23:20:39.319Z, and the agent''s first post-wake action `date -u +%FT%TZ > woke-at.txt` ran at 23:20:43.564Z writing "2026-09-02T23:20:43Z". Of the 22 s, about 18 s is the loop''s sleep 30 granularity and 4 s is the model round trip. The driver''s prompt returned at 23:21:01.161Z after the agent finished writing woke-at.txt and its DONE line'
    source: timeline.yaml trigger, woke_at_txt, latency_trigger_to_woke_s; session/2026/09/02/rollout-2026-09-02T16-18-20-01a0646a-8f65-7a93-813c-dfda1271f701.jsonl custom_tool_call_output 23:20:39.319Z and custom_tool_call exec 23:20:43.564Z; drive.log lines 10-16
  - id: wake.event_kinds
    observed: 'Exercised: a file appearing, tested by the agent''s own shell loop, plus the loop''s own timer bound (not reached). Documented or seen elsewhere in this harness but not exercised here: wait_agent({timeout_ms}) for a spawned worker finishing, returning {"message":"Wait completed.","timed_out":false} (seen in worker_defaults_identity.codex.2026-09-02.02 and worker_defaults_model.codex.2026-09-02.01), and the wait tool on an exec cell ({cell_id, yield_time_ms}) for a running shell command, used here for the loop. No peer-message wait, file-watch, or arbitrary external-signal wait exists; the binary also carries a "clock.sleep" tool name that this run did not exercise'
    source: wait-accounting.yaml wait_call; session/2026/09/02/rollout-2026-09-02T16-18-20-01a0646a-8f65-7a93-813c-dfda1271f701.jsonl function_call wait items; evidence/runs/worker_defaults_identity.codex.2026-09-02.02/invocation.json calls_workers (wait_agent); strings of the codex-cli 0.152.1 binary on the bench host ("clock.sleep")
  - id: wake.timeout_behavior
    observed: 'Blocked past the budget; the driver aborted it. Trial 2 entered the same loop at 23:21:17.784Z with its 1200 s bound and was still polling (write_stdin every ~60 s, last at 23:26:03.697Z) when herdr''s prompt wait expired at 319,158 ms ({"error":{"code":"timeout","message":"timed out waiting for agent status"}}). The driver sent esc at 23:26:20.554Z; the rollout records the tool output "aborted by user after 16.9s" and event turn_aborted reason "interrupted", event.flag absent. On the closing prompt the agent appended to woke-at.txt "wait was interrupted; returned: nothing (the command was aborted)" and replied "DONE The second shell wait was interrupted before returning, with no result." Had the loop reached its own bound it would have exited 124, which the agent could tell from the event''s exit 0; so timeout is distinguishable, but only because the agent built the bound into its own loop, not because the harness supplies one'
    source: no-trigger-trial.md lines 1-17; drive.log lines 20-30; session/2026/09/02/rollout-2026-09-02T16-18-20-01a0646a-8f65-7a93-813c-dfda1271f701.jsonl custom_tool_call_output 23:26:20.574Z, event_msg turn_aborted 23:26:20.620Z, assistant message 23:26:30.932Z
