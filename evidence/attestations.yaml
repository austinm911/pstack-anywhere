# Attestation registry: the records that raise a coupling.yaml cell's
# verification. Records index, never judge. There is no pass, parity, or
# status field; scripts/coupling.mjs derives verification from the method
# and from digest freshness on every run. An empty list means nothing was
# looked at, so every cell is unverified.
# Run artifacts live under evidence/runs/; each cited file gets its own digest.
# Records missing published logs are preserved outside this active registry in
# evidence/withdrawn/2026-10-13-missing-logs.yaml and establish no verification.
# Supersedes: a later record for the same axis, parameter, and harness may
# name an earlier one. The earlier record stays readable and counts for nothing.
# Terms: README.md#vocabulary

version: 1

# ---------------------------------------------------------------------------

semantics:
  empty_means: >-
    Unverified. No harness was exercised, no source cited, no local
    observation recorded. It says what was done, not what is true.
  derived_elsewhere: >-
    scripts/coupling.mjs derives each cell's verification from the records
    here. No record may carry a verification tier by hand; treat such a key
    as a bug.
  precedence: >-
    exercised outranks observed_local, which outranks static, which outranks
    unverified. The order only decides what a cell displays. A stronger record
    does not erase a weaker one; both stay. Whether a cell counts as verified
    is folded over every record on it, so adding an observed_local note beside
    a valid static citation raises what the cell shows and never lowers what
    it has earned.
  never_verified: >-
    observed_local never renders as verified, at any count. It is a note about
    one machine on one day.
  staleness: >-
    A record whose cited file no longer matches its digest is stale. Stale is
    not unverified and not a failed claim. The ground moved and a human has to
    look again.
  void: >-
    A record that does not validate grounds nothing and ranks below
    unverified. A record whose run is not complete, whose digests do not cover
    the run directory, or whose citation resolves to nothing raises no cell.
  superseded: >-
    A record that a later record replaces, for the same axis, parameter, and
    harness. It stays readable and counts for nothing.

methods:
  - id: static
    means: >-
      A claim read from pinned upstream source saved under references/. Proves
      what the code says, not what the installed binary does.
    requires:
      - >-
        At least one `sources` entry under references/, with the file's
        sha256, the upstream repo and ref, a line range, and an expected
        substring the engine finds at that range.
      - >-
        A harness with saved source. cursor is upstream's own target and has
        none, so no cursor cell can reach static.
    cannot_support: >-
      Any scenario in conformance/scenarios.yaml. Scenarios are runs, so a
      static record that names a scenario is rejected.
  - id: observed_local
    means: >-
      Behavior seen on one operator's machine, not reproducible from this
      repo. This class exists so such notes are not filed as static.
    requires:
      - >-
        An `observation` block: machine, os, cli_version, the
        cli_version_command that printed it, a UTC date, and a verbatim excerpt
        of what was seen. Every field, or nobody can re-check it.
    cannot_support: A verified rendering, ever. See semantics.never_verified.
  - id: exercised
    means: >-
      A conformance scenario was run end to end and its evidence directory is
      complete against that scenario's evidence contract.
    requires:
      - >-
        A `scenario` whose cell is this record's cell and whose applies_to
        names this harness, and a `run` directory under evidence/runs/ that is
        complete against that scenario's evidence contract.
      - >-
        An `artifacts` list with the sha256 of every file in that directory,
        no file omitted and no path recorded that is not there. Each is a
        regular file; symlinks are never digested.
      - >-
        Every declared observation recorded in the run, each entry exactly
        `{id, observed, source}` or exactly `{id, unsatisfiable}` with the
        reason in text. The second shape is allowed only where the scenario
        declares an `unsatisfiable_when` for that observation.
      - >-
        A run no later complete run supersedes. A correction is a later run of
        the same scenario on the same harness that names this one in
        `supersedes`. If one exists, this run is void and a record citing it
        is rejected naming the correcting run, unless a later record supersedes
        the citing record too; then it stays readable and counts for nothing.
    cannot_support: >-
      A cell for a harness the run did not touch. One run grounds one harness.

# ---------------------------------------------------------------------------

# Documentation only. The engine rejects any record key not named here. The
# method decides which grounding keys a record may carry; a key from another
# method is rejected. This block is not a record.
record_schema:
  id:
    required: true
    what: >-
      Stable slug, unique in this file. Named only by another record's
      `supersedes`, so it may otherwise be renamed freely.
  method:
    required: true
    what: One of the ids in `methods`.
  axis:
    required: true
    what: An axis id in coupling.yaml. Must resolve.
  parameter:
    required: false
    what: >-
      A parameter id. Required when the axis is a parameter set, forbidden
      otherwise. worker_defaults takes background, readonly, identity, or model.
  harness:
    required: true
    what: >-
      One harness id that resolves in coupling.yaml. One record never covers
      several harnesses; the gap is per cell, never per row.
  scenario:
    required: >-
      For method exercised. Forbidden for static and observed_local.
    what: >-
      A scenario id in conformance/scenarios.yaml. It must resolve, its axis
      and parameter must be this record's cell, and this record's harness must
      be in its applies_to.
  run:
    required: For method exercised. Forbidden for every other method.
    what: >-
      A directory name under evidence/runs/, matching that scenario's run_id
      form. It must exist, encode this record's scenario and harness, and be
      complete against the scenario's evidence contract: every required
      artifact a regular file with non-whitespace content, every observation
      satisfied or legally waived, and no later complete run of the same
      scenario and harness superseding it. See run_states in
      conformance/scenarios.yaml: complete is the only state a record may
      cite, and citing it is still not a verification by itself.
  artifacts:
    required: For method exercised. Forbidden for every other method.
    what: >-
      One entry per file in the run directory; see artifact_entry. Every file,
      nothing left out, nothing recorded that is not there. A digest that no
      longer matches disk is void_conditions.digest_mismatch in
      conformance/scenarios.yaml.
  sources:
    required: >-
      At least one for static. Allowed and checked for observed_local, where
      an observation may cite the source it confirms or contradicts. Forbidden
      for exercised.
    what: A list of source entries; see source_entry.
  observation:
    required: For method observed_local. Forbidden for every other method.
    what: >-
      machine, os, cli_version, cli_version_command, date as a UTC YYYY-MM-DD,
      and excerpt. All six are required and no other key is allowed.
  recorded:
    required: true
    what: >-
      `{ date, by }`: the UTC YYYY-MM-DD the record was written, and who wrote
      it. Both fields, always.
  note:
    required: Whenever `supersedes` is set. Otherwise optional.
    what: >-
      What this record does and does not establish. Use it to narrow an
      overreaching citation instead of deleting it, and to give the reason a
      superseding record replaced the earlier one.
  supersedes:
    required: false
    what: >-
      The id of an earlier record in this file. Not this record, and about the
      same cell: same axis, parameter, and harness. A superseded record stays
      readable and counts for nothing.

source_entry:
  path:
    required: true
    what: >-
      Repo-relative, under references/, with no `..` segment. Not a path
      outside the repo, not a file this repo generates, and not another
      harness's saved source.
  digest:
    required: true
    what: >-
      sha256 of the file at `path`, written by the tooling, never typed by
      hand. This is what makes staleness localize to a single file.
  lines:
    required: true
    what: >-
      `<from>` or `<from>-<to>`, the range supporting the claim, in the
      ORIGINAL upstream file's numbering. A range outside the saved file is
      rejected.
    truncated_files: >-
      Several saved references are excerpts named `<name>.L<a>-L<b>.<ext>`.
      Cite upstream numbers; the engine reads <a> from the filename and
      subtracts the offset. A naive line number inside an excerpt points at
      unrelated code.
  expect:
    required: true
    what: >-
      A substring the engine must find within the cited range. A citation the
      engine cannot confirm is not a citation. An upstream refactor then makes
      the record stale instead of silently wrong.
  upstream:
    required: true
    what: >-
      The repo and ref the file was saved at. Cross-check against the ref in
      harnesses.yaml.

artifact_entry:
  path:
    required: true
    what: >-
      One file in the cited run directory, run-relative, exactly as
      `probe inspect` lists it. Every file, not only the declared artifacts.
  digest:
    required: true
    what: >-
      sha256 of that file, recomputed from disk on every read.
      `bun scripts/coupling.mjs probe inspect <run-id>` prints all of them.
      Never typed by hand.

